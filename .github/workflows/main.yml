name: Android OSS Release

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-oss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unlocked OSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 获取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 配置 Android SDK
      # 不再安装已下架的旧版 tools 包
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 安装项目所需 Android SDK
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 编译解锁版 OSS APK
      - name: Build OSS release APK
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          chmod +x ./gradlew

          if [ -n "$OAUTH_CLIENT_ID" ]; then
            ./gradlew --no-daemon :app:assembleOssRelease -POAUTH_CLIENT_ID="$OAUTH_CLIENT_ID"
          else
            echo "::warning::OAUTH_CLIENT_ID is not configured. OAuth sign-in will not be configured."
            ./gradlew --no-daemon :app:assembleOssRelease
          fi

      # 上传 APK 构建产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-OSS-unlocked
          path: apps/android/app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error
          retention-days: 30
